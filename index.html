<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arsenal Designer</title>
  <meta name="description" content="Arsenal Designer — открытая база геймдизайна PvPvE-экстракшена с рогалик-драфтом: оружие, модификаторы, модули, композиционная система эффектов, реакции статусов, правила драфта. Машиночитаемые данные: /data.json, спека: /docs/mechanics.md, для ИИ-агентов: /llms.txt">
  <link rel="alternate" type="application/json" href="/data.json" title="Arsenal data (canonical JSON)">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">ARSENAL<span>DESIGNER</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview">Обзор</button>
      <button data-tab="weapons">Оружие</button>
      <button data-tab="mods">Модификаторы</button>
      <button data-tab="modules">Модули</button>
      <button data-tab="items">Предметы</button>
      <button data-tab="synergy">Синергии</button>
      <button data-tab="builder">Конструктор</button>
      <button data-tab="meta">Мета</button>
      <button data-tab="data">Данные</button>
    </nav>
    <div class="topbar-right">
      <span id="saveState" class="muted">сохранено</span>
    </div>
  </header>

  <main id="view">
    <!-- Статический fallback: виден без JS и краулерам. UI заменяет его после загрузки data.json. -->
    <noscript>
      <h1>Arsenal Designer</h1>
      <p>Интерактивный UI требует JavaScript. Машиночитаемая версия проекта:</p>
      <ul>
        <li><a href="/data.json">data.json</a> — канонические данные (оружие, моды, модули, предметы, нагрузки, доставки, реакции, конфиг драфта, мета)</li>
        <li><a href="/docs/mechanics.md">docs/mechanics.md</a> — спецификация механик и формул</li>
        <li><a href="/docs/catalog.md">docs/catalog.md</a> — каталог контента в Markdown (генерируется из data.json)</li>
        <li><a href="/schema/data.schema.json">schema/data.schema.json</a> — JSON Schema данных</li>
        <li><a href="/unity.json">unity.json</a> — экспорт для движка</li>
        <li><a href="/llms.txt">llms.txt</a> — вход для ИИ-агентов</li>
      </ul>
    </noscript>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div id="modalTitle">Редактор</div>
        <button id="modalClose" class="btn ghost">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script>
    // Источник истины — data.json. Загружаем его, кладём в window.DEFAULT_DATA и только потом стартуем app.js.
    fetch('data.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then((d) => { window.DEFAULT_DATA = d; const s = document.createElement('script'); s.src = 'app.js'; document.body.appendChild(s); })
      .catch((e) => {
        document.getElementById('view').innerHTML = '<div class="card" style="margin:24px"><h2>Не удалось загрузить data.json</h2><p class="muted">' + String(e.message) +
          '. Открой проект через HTTP-сервер (например <span class="mono">npx serve</span> или <span class="mono">python -m http.server 8765</span>), а не как file://.</p></div>';
      });
  </script>
</body>
</html>
