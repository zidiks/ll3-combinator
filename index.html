<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arsenal Designer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">ARSENAL<span>DESIGNER</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview">Обзор</button>
      <button data-tab="weapons">Оружие</button>
      <button data-tab="mods">Модификаторы</button>
      <button data-tab="modules">Модули</button>
      <button data-tab="items">Предметы</button>
      <button data-tab="synergy">Синергии</button>
      <button data-tab="builder">Конструктор</button>
      <button data-tab="meta">Мета</button>
      <button data-tab="data">Данные</button>
    </nav>
    <div class="topbar-right">
      <span id="saveState" class="muted">сохранено</span>
    </div>
  </header>

  <main id="view"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div id="modalTitle">Редактор</div>
        <button id="modalClose" class="btn ghost">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
